name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest tests -q
      - run: python -m ruff check hermes-plugin tests scripts/*.py

  desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.12.0"
          cache: npm
      - run: npm ci
      - run: npm run desktop:test
      - run: npm run desktop:build
      - name: Verify bundled imports
        run: |
          unexpected_imports="$({ grep -Eo "from[[:space:]]+['\"][^'\"]+['\"]|import[[:space:]]+['\"][^'\"]+['\"]" hermes-plugin/desktop/plugin.js || true; } | grep -Ev "(@hermes/plugin-sdk|react/jsx-runtime|react)['\"]$" || true)"
          test -z "$unexpected_imports"

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - run: bash scripts/verify-android-worker.sh
