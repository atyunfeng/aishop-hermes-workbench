name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest tests -q
      - run: python -m ruff check hermes-plugin tests scripts/*.py

  desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.12.0"
          cache: npm
      - run: npm ci
      - run: npm run desktop:test
      - run: npm run desktop:build
      - name: Verify bundled imports
        run: |
          unexpected_imports="$({ grep -Eo "from[[:space:]]+['\"][^'\"]+['\"]|import[[:space:]]+['\"][^'\"]+['\"]" hermes-plugin/desktop/plugin.js || true; } | grep -Ev "(@hermes/plugin-sdk|react/jsx-runtime|react)['\"]$" || true)"
          test -z "$unexpected_imports"

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - name: Install verification tools
        run: sudo apt-get update && sudo apt-get install --yes ripgrep
      - run: bash scripts/verify-android-worker.sh
