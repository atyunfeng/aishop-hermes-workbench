name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.12.0"
          cache: npm
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - name: Install verification tools
        run: sudo apt-get update && sudo apt-get install --yes ripgrep
      - name: Install Python dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -e '.[dev]'
      - run: npm ci
      - run: bash scripts/verify-phase1.sh
      - uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: .
          format: spdx-json
          output-file: artifacts/aishop-workbench.spdx.json
          upload-artifact: false
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: aishop-${{ github.ref_name }}
          path: |
            artifacts/AIShop-Hermes-Workbench-phase1.zip
            artifacts/AIShop-Hermes-Workbench-phase1.zip.sha256
            artifacts/aishop-worker-debug.apk
            artifacts/aishop-worker-debug.apk.sha256
            artifacts/aishop-workbench.spdx.json
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease_args=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            prerelease_args+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" \
            artifacts/AIShop-Hermes-Workbench-phase1.zip \
            artifacts/AIShop-Hermes-Workbench-phase1.zip.sha256 \
            artifacts/aishop-worker-debug.apk \
            artifacts/aishop-worker-debug.apk.sha256 \
            artifacts/aishop-workbench.spdx.json \
            --generate-notes \
            --title "AIShop Hermes Workbench $GITHUB_REF_NAME" \
            "${prerelease_args[@]}"
