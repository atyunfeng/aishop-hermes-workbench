name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.12.0"
          cache: npm
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - run: python -m pip install -e '.[dev]'
      - run: npm ci
      - run: bash scripts/verify-phase1.sh
      - uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: .
          format: spdx-json
          output-file: artifacts/aishop-workbench.spdx.json
          upload-artifact: false
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: aishop-${{ github.ref_name }}
          path: |
            artifacts/AIShop-Hermes-Workbench-phase1.zip
            artifacts/AIShop-Hermes-Workbench-phase1.zip.sha256
            artifacts/aishop-worker-debug.apk
            artifacts/aishop-worker-debug.apk.sha256
            artifacts/aishop-workbench.spdx.json
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            artifacts/AIShop-Hermes-Workbench-phase1.zip \
            artifacts/AIShop-Hermes-Workbench-phase1.zip.sha256 \
            artifacts/aishop-worker-debug.apk \
            artifacts/aishop-worker-debug.apk.sha256 \
            artifacts/aishop-workbench.spdx.json \
            --generate-notes \
            --title "AIShop Hermes Workbench $GITHUB_REF_NAME"
