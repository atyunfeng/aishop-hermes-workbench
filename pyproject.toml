[project]
name = "aishop-workbench"
version = "0.1.0"
description = "Local-first Hermes e-commerce AI automation workbench"
readme = "README.md"
license = "AGPL-3.0-only"
authors = [{ name = "AIShop contributors" }]
requires-python = ">=3.11"
dependencies = []

[project.urls]
Homepage = "https://github.com/atyunfeng/aishop-hermes-workbench"
Repository = "https://github.com/atyunfeng/aishop-hermes-workbench"
Issues = "https://github.com/atyunfeng/aishop-hermes-workbench/issues"

[project.optional-dependencies]
dev = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "jsonschema>=4.23,<5",
  "pillow>=12,<13",
  "pytest>=9.0.3,<10",
  "ruff>=0.9,<1",
]

[tool.pytest.ini_options]
pythonpath = ["hermes-plugin"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint.per-file-ignores]
"hermes-plugin/**/*.py" = ["N999"]
"hermes-plugin/__init__.py" = ["N999"]
"hermes-plugin/dashboard/plugin_api.py" = ["BLE001", "N999"]
